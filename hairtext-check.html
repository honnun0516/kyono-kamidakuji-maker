<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>髪吉 文章チェック</title><style>:root{--ink:#4b210d;--paper:#fffdf7;--blue:#35b7ec;--line:#eadbc8}*{box-sizing:border-box}body{margin:0;background:#f5fbff;color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.65}main{max-width:760px;margin:auto;padding:28px 18px 48px}h1{font-size:28px;line-height:1.35;margin:0 0 6px}p{margin:0 0 20px}.count{font-weight:800;color:#187ca5}.item{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:15px;margin:10px 0;font-size:17px;font-weight:600}.item input{width:25px;height:25px;min-width:25px;margin:2px 0 0;accent-color:var(--blue)}.item:has(input:checked){background:#eaf8ff;border-color:var(--blue)}button{width:100%;border:0;border-radius:16px;padding:15px;background:var(--blue);color:#fff;font-weight:900;font-size:17px;margin-top:18px}.note{font-size:14px;color:#725a4a;margin-top:12px}</style><main><h1>髪吉・追加文章 60個</h1><p>残したい文章をタップしてチェックしてね。チェックはこの端末に残ります。<br><span class="count" id="count">0個選択中</span></p><div id="list"></div><button id="copy" type="button">チェックした文章をコピー</button><p class="note" id="notice" aria-live="polite"></p></main><script>const texts=['今日は前髪が言うことを聞く日。小さな幸せ、もう一個見つかりそう。','髪がいい感じの日は、コンビニの新作まで当たりな気がする。','ふと写ったガラスの自分に、ちょっとだけご機嫌になれそう。','待ち合わせに少し早く着けそう。髪も気持ちも余裕です。','今日の毛先、やさしい。人にもやさしくできる予感。','髪が決まったから、帰り道に好きなものを買って帰りたくなる日。','風が吹いても大丈夫。むしろスーパーモデルの振る舞いで歩いて。','鏡の前で「よし」と言える朝。今日はそれだけで合格。','いつもより連絡を返すのが少し楽しくなりそう。髪のご機嫌、侮れない。','髪がまとまると、なぜか部屋まで片づけたくなる。いい流れです。','今日の髪、写真に写りたがっています。カメラロールに一枚どうぞ。','お昼すぎても前髪が健在。午後の予定にも安心して行けそう。','今日のセット、思ったより早く終わりそう。余った5分は自分を褒めよう。','髪がいい日は、いつもの服まで少し格上げされる気がする。','何気ない「おつかれさま」が、いつもより嬉しく聞こえそう。','今日の髪は、話しかけやすそうな雰囲気まで作ってくれるかも。','予定がなくても外に出たくなる日。髪型が背中を押してくれます。','寝ぐせとの交渉が、平和的にまとまりそう。今日は勝ちです。','髪がツヤっとすると、信号も電車もいいタイミングで来そうな気がする。','今日は「なんかいい日だったな」で終われそう。髪から始まるごきげん日和。','今日は風を味方につける予定です。横断歩道はランウェイ。','髪が決まったから、レジで「袋いりますか？」に即答できそう。','今日は後ろ姿にも責任を持てる日。振り返る準備はできてます。','前髪が整っただけで、人類にやさしくなれそう。','髪がいいと、通知が来なくてもスマホを見ちゃうくらいごきげん。','髪型が決まったので、今日はインカメも怖くない。','今日の髪、エレベーターの鏡で二度見する価値あり。','髪のツヤがいい日は、予定表にない寄り道も正解。','今日の頭頂部、ちゃんと働いてます。拍手。','髪が決まった勢いで、放置してた返信も一件だけ返せそう。','信号待ちの風で試されても、今日は笑顔で乗り切れそう。','今日の髪、カフェの窓際席が似合う仕上がり。','美容室行ってないのに、美容室行った顔で歩ける日。','髪がいいので、写真を撮る時は「たまたまです」の顔をしよう。','今日はアホ毛も個性。と思えるくらい全体がいい感じ。','髪型が決まると、ついコンビニのガラスに映る自分を確認してしまう。','今日の自分、いつもより駅のホームで姿勢がいいかも。','髪が決まった日は、ちょっとだけ返信も丁寧になれる。','今日の毛先、機嫌がいい。たぶん夕方まで一緒にいてくれる。','なんかいい髪の日。帰宅後も鏡に「おつかれ」って言いたくなる。','髪が決まったので、本日は歩く角度まで意識していきます。','今日の髪、改札のガラスにもごあいさつしておこう。','今日は「たまたま可愛い日」の顔で過ごす。','髪のツヤで、蛍光灯の下でも少し勝負できる。','今日は会話中に髪を耳にかけるタイミングまで計算済み。','髪型が決まったので、証明写真の列に並んでもいけそう。','今日の横顔、知らないふりして何度も確認したい。','髪が決まると、コンビニ店員さんへの返事もいつもよりハキハキ。','本日の前髪、出勤済み。やる気も見習ってほしい。','髪がいい日は、用事のない駅でも降りたくなる。','今日の自分、誰かの待ち受けにいてもおかしくない。','髪のコンディションがいいので、姿勢まで1cm伸びる。','朝の鏡に勝てた日は、だいたい良い1日になる。','今日は風に吹かれても「演出です」の顔ができそう。','髪が決まったので、カフェのメニューも背伸びして選べそう。','今日の毛先、急に大人っぽい。私までつられてる。','髪がまとまるだけで、人生のタスクが3つ片づいた気分。','本日の髪、待ち合わせ相手より先に褒めてあげたい。','今日は誰にも会わなくても、ちゃんと仕上げた自分を褒めたい。','髪がいいから、帰りに花を一輪買ってもいい気がする。'];const key='kamiyoshi-checks-v1',saved=new Set(JSON.parse(localStorage.getItem(key)||'[]')),list=document.querySelector('#list'),count=document.querySelector('#count');function refresh(){const chosen=[...saved].sort((a,b)=>a-b);localStorage.setItem(key,JSON.stringify(chosen));count.textContent=chosen.length+'個選択中'}texts.forEach((text,index)=>{const label=document.createElement('label');label.className='item';const input=document.createElement('input');input.type='checkbox';input.checked=saved.has(index);input.addEventListener('change',()=>{input.checked?saved.add(index):saved.delete(index);refresh()});const span=document.createElement('span');span.textContent=(index+11)+'. '+text;label.append(input,span);list.append(label)});refresh();document.querySelector('#copy').addEventListener('click',async()=>{const picked=[...saved].sort((a,b)=>a-b).map(i=>(i+11)+'. '+texts[i]).join('\n');if(!picked){document.querySelector('#notice').textContent='まず残したい文章にチェックを入れてね。';return}try{await navigator.clipboard.writeText(picked);document.querySelector('#notice').textContent='チェックした文章をコピーしました。ここに貼り付けて送ってね。'}catch{document.querySelector('#notice').textContent='コピーできなかったため、チェック済みの番号を教えてね。'}})</script>
