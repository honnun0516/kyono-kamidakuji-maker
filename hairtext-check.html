<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>髪吉 文章チェック</title><style>:root{--ink:#4b210d;--paper:#fffdf7;--blue:#35b7ec;--line:#eadbc8}*{box-sizing:border-box}body{margin:0;background:#f5fbff;color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.65}main{max-width:760px;margin:auto;padding:28px 18px 48px}h1{font-size:28px;line-height:1.35;margin:0 0 6px}p{margin:0 0 20px}.count{font-weight:800;color:#187ca5}.item{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:15px;margin:10px 0;font-size:17px;font-weight:600}.item input{width:25px;height:25px;min-width:25px;margin:2px 0 0;accent-color:var(--blue)}.item:has(input:checked){background:#eaf8ff;border-color:var(--blue)}button{width:100%;border:0;border-radius:16px;padding:15px;background:var(--blue);color:#fff;font-weight:900;font-size:17px;margin-top:18px}.note{font-size:14px;color:#725a4a;margin-top:12px}</style><main><h1>髪吉・追加文章 20個</h1><p>残したい文章をタップしてチェックしてね。チェックはこの端末に残ります。<br><span class="count" id="count">0個選択中</span></p><div id="list"></div><button id="copy" type="button">チェックした文章をコピー</button><p class="note" id="notice" aria-live="polite"></p></main><script>const texts=['今日は前髪が言うことを聞く日。小さな幸せ、もう一個見つかりそう。','髪がいい感じの日は、コンビニの新作まで当たりな気がする。','ふと写ったガラスの自分に、ちょっとだけご機嫌になれそう。','待ち合わせに少し早く着けそう。髪も気持ちも余裕です。','今日の毛先、やさしい。人にもやさしくできる予感。','髪が決まったから、帰り道に好きなものを買って帰りたくなる日。','風が吹いても大丈夫そう。むしろ映画のワンシーンかも。','鏡の前で「よし」と言える朝。今日はそれだけで合格。','いつもより連絡を返すのが少し楽しくなりそう。髪のご機嫌、侮れない。','髪がまとまると、なぜか部屋まで片づけたくなる。いい流れです。','今日の髪、写真に写りたがっています。カメラロールに一枚どうぞ。','お昼すぎても前髪が健在。午後の予定にも安心して行けそう。','今日のセット、思ったより早く終わりそう。余った5分は自分を褒めよう。','髪がいい日は、いつもの服まで少し格上げされる気がする。','何気ない「おつかれさま」が、いつもより嬉しく聞こえそう。','今日の髪は、話しかけやすそうな雰囲気まで作ってくれるかも。','予定がなくても外に出たくなる日。髪型が背中を押してくれます。','寝ぐせとの交渉が、平和的にまとまりそう。今日は勝ちです。','髪がツヤっとすると、信号も電車もいいタイミングで来そうな気がする。','今日は「なんかいい日だったな」で終われそう。髪から始まるごきげん日和。'];const key='kamiyoshi-checks-v1',saved=new Set(JSON.parse(localStorage.getItem(key)||'[]')),list=document.querySelector('#list'),count=document.querySelector('#count');function refresh(){const chosen=[...saved].sort((a,b)=>a-b);localStorage.setItem(key,JSON.stringify(chosen));count.textContent=chosen.length+'個選択中'}texts.forEach((text,index)=>{const label=document.createElement('label');label.className='item';const input=document.createElement('input');input.type='checkbox';input.checked=saved.has(index);input.addEventListener('change',()=>{input.checked?saved.add(index):saved.delete(index);refresh()});const span=document.createElement('span');span.textContent=(index+11)+'. '+text;label.append(input,span);list.append(label)});refresh();document.querySelector('#copy').addEventListener('click',async()=>{const picked=[...saved].sort((a,b)=>a-b).map(i=>(i+11)+'. '+texts[i]).join('\n');if(!picked){document.querySelector('#notice').textContent='まず残したい文章にチェックを入れてね。';return}try{await navigator.clipboard.writeText(picked);document.querySelector('#notice').textContent='チェックした文章をコピーしました。ここに貼り付けて送ってね。'}catch{document.querySelector('#notice').textContent='コピーできなかったため、チェック済みの番号を教えてね。'}})</script>
