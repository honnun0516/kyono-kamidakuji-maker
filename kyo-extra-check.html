<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>凶・追加候補チェック表</title><style>body{margin:0;background:#fff7f5;color:#35170d;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}main{max-width:760px;margin:auto;padding:32px 20px 60px}h1{font-size:28px;margin:0 0 8px}p{line-height:1.7}section{background:#fff;border-radius:20px;padding:14px;margin-top:22px;box-shadow:0 8px 24px #6f251916}label{display:flex;gap:12px;padding:15px 8px;border-bottom:1px solid #f3dfd8;line-height:1.6;cursor:pointer}label:last-child{border:0}input{width:22px;height:22px;margin:3px 0 0;accent-color:#e86478;flex:none}button{border:0;background:#e86478;color:#fff;padding:12px 17px;border-radius:99px;font-weight:700;font-size:15px;cursor:pointer}.count{font-weight:700;color:#cf4b62}</style><main><h1>凶・追加候補チェック表</h1><p>気に入った文章にチェックを入れてね。<span class="count" id="count">0件選択中</span></p><button id="clear">チェックを外す</button><section><label><input type="checkbox" data-id="32"><span>32. 髪を完璧に巻いた日に限って、帽子をかぶる予定が入るでしょう。</span></label><label><input type="checkbox" data-id="33"><span>33. 前髪がうまく決まった日に限って、マスクを外す用事がないでしょう。</span></label><label><input type="checkbox" data-id="34"><span>34. 髪をセットし終わった直後に、顔を洗い忘れたことに気づくでしょう。</span></label><label><input type="checkbox" data-id="35"><span>35. 今日は髪を下ろして出かけたのに、ラーメンを食べる流れになるでしょう。</span></label><label><input type="checkbox" data-id="36"><span>36. 前髪を直している間に電車が来るでしょう。乗るか、直すか、人生の選択です。</span></label><label><input type="checkbox" data-id="37"><span>37. 髪型が決まらない朝ほど、なぜか宅配便が早く来るでしょう。</span></label><label><input type="checkbox" data-id="38"><span>38. ヘアオイルをちょうどよく付けたつもりが、前髪だけ天ぷらになるでしょう。</span></label><label><input type="checkbox" data-id="39"><span>39. 髪をきれいに結んだ日に限って、ゴムが切れるでしょう。しかも予備は家です。</span></label><label><input type="checkbox" data-id="40"><span>40. 鏡で後ろ髪を確認していたら、首だけがつりそうになるでしょう。</span></label><label><input type="checkbox" data-id="41"><span>41. 前髪を巻いた直後、くしゃみで全部終わるでしょう。</span></label><label><input type="checkbox" data-id="42"><span>42. 今日は髪が広がる日。服を着替えるたび、静電気が追加されるでしょう。</span></label><label><input type="checkbox" data-id="43"><span>43. 髪を直すために立ち寄ったトイレの鏡が、いつもより正直でしょう。</span></label><label><input type="checkbox" data-id="44"><span>44. 分け目を変えたらいい感じ。でも元の分け目が全力で戻ろうとするでしょう。</span></label><label><input type="checkbox" data-id="45"><span>45. 髪型が決まったので写真を撮ったら、背景のゴミ箱がいちばん目立つでしょう。</span></label><label><input type="checkbox" data-id="46"><span>46. 出かける直前に髪を結び直して、さっきより悪くなるでしょう。</span></label><label><input type="checkbox" data-id="47"><span>47. 前髪を気にしている日に限って、向かい風の道を選んでしまうでしょう。</span></label><label><input type="checkbox" data-id="48"><span>48. 髪はなんとかまとまった。でも眉毛が片方だけ行方不明でしょう。</span></label><label><input type="checkbox" data-id="49"><span>49. 今日の髪、なかなかいい感じ。でもレジで財布が見つからず、全体の余裕が消えるでしょう。</span></label><label><input type="checkbox" data-id="50"><span>50. 髪を直しているうちに遅刻しそう。仕上がりは微妙、時間だけ完璧に失うでしょう。</span></label><label><input type="checkbox" data-id="51"><span>51. 髪型は完成。でも服のタグが出ていることに、帰宅してから気づくでしょう。</span></label></section></main><script>const boxes=[...document.querySelectorAll("input")],key="kyo-extra-checks";const saved=JSON.parse(localStorage.getItem(key)||"[]");boxes.forEach(b=>b.checked=saved.includes(b.dataset.id));function sync(){const a=boxes.filter(b=>b.checked).map(b=>b.dataset.id);localStorage.setItem(key,JSON.stringify(a));document.querySelector("#count").textContent=a.length+"件選択中"}boxes.forEach(b=>b.onchange=sync);document.querySelector("#clear").onclick=()=>{boxes.forEach(b=>b.checked=false);sync()};sync()</script></html>
