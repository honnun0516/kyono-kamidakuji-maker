<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>日常あるあるネタ帳</title>
<style>
:root{--ink:#472817;--pink:#ff8199;--cream:#fffaf2;--line:#f0d8bd}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(150deg,#fff9ef,#fff0f4 52%,#f5edff);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",sans-serif}
main{width:min(860px,calc(100% - 32px));margin:0 auto;padding:38px 0 70px}
h1{font-size:clamp(26px,5vw,42px);margin:0 0 8px;letter-spacing:.04em}.lead{margin:0 0 20px;font-weight:700;line-height:1.7}
.toolbar{position:sticky;top:12px;z-index:3;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fffdf9dd;backdrop-filter:blur(10px);padding:12px;border:2px solid var(--line);border-radius:20px;box-shadow:0 8px 25px #c87c9822}
button{border:0;border-radius:999px;background:var(--pink);color:#fff;font:800 16px inherit;padding:12px 18px;cursor:pointer}button.secondary{background:#f2d7aa;color:var(--ink)}#count{font-weight:900;margin-left:auto}
.list{margin-top:22px;display:grid;gap:10px}.idea{display:flex;gap:12px;align-items:flex-start;background:#fffdf9;border:2px solid var(--line);border-radius:17px;padding:14px 16px;line-height:1.65;font-weight:700;cursor:pointer}.idea:has(input:checked){background:#fff0f3;border-color:var(--pink);text-decoration:line-through;text-decoration-thickness:2px}.idea input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--pink);margin-top:3px}.num{color:#d95c78;font-weight:900;margin-right:4px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:11px 17px;border-radius:99px;font-weight:800;opacity:0;transition:.2s;pointer-events:none}#toast.show{opacity:1}
@media(max-width:540px){main{width:min(100% - 20px,860px);padding-top:24px}.toolbar{top:6px}#count{width:100%;margin-left:0}.idea{padding:12px}}
</style></head>
<body><main><h1>日常あるあるネタ帳</h1><p class="lead">気になったネタにチェック。<br>「選んだネタをコピー」で、番号つきの文章だけをまとめてコピーできます。</p>
<div class="toolbar"><button id="copy">選んだネタをコピー</button><button class="secondary" id="clear">チェックを外す</button><span id="count">0件を選択中</span></div><section class="list" id="list"></section></main><div id="toast">コピーしました！</div>
<script>
const ideas=["スーパーで買う物を3つ覚えて行ったのに、2つ目をカゴへ入れた瞬間、全部忘れる。","冷蔵庫を開けて「何か食べたい」と思う。閉めて3秒後、もう一度開ける。","玄関を出てから、鍵を閉めたか急に不安になる。戻る。ちゃんと閉まっている。","イヤホンを探して10分。首にかかっている。","スマホを探して部屋じゅう歩き回る。スマホのライトで探している。","レジに並んでから、財布を家に置いてきた可能性に気づく。","「今日は早く寝る」と決めた日に限って、急に部屋の片づけを始める。","目覚ましを止めた記憶だけがある。起きた記憶はない。","お湯を沸かしている間に別のことをして、気づけば鍋だけがずっと本気。","メガネを探しているのに、メガネをかけていないと見つからない。","コンビニで温めてもらったのに、箸をもらうのを忘れる。","外で「今日あったかいな」と思って上着を置いて出る。夜にだけ季節が変わる。","エレベーターの「閉」ボタンを押したのに、誰かが来そうでドアを見つめ続ける。","送信ボタンを押した直後に、誤字が一番大きく見える。","寝る前に充電器を挿したつもりで、朝スマホを見る。1％です。","部屋を片づけ始めたら、昔の写真を発見。片づけは本日休業です。","「あと5分だけ横になる」が、目覚ましの次の出番になる。","自動ドアに近づいたのに開かない。自分だけ、ちょっと機械に嫌われた気がする。","レンジを止めた直後、まだ温めるべきだったか考え始める。","洗濯物を干して満足した直後、ポケットからティッシュが発見される。","カフェで席を取ってから、注文する店だったことに気づく。","何かを調べるためにスマホを開いたのに、気づいたら全然違う動画を見ている。","友だちに会う直前だけ、靴ひもがほどける。存在感の出しどころが違う。","電車で座れた瞬間、降りる駅が近いことに気づく。","傘を持って出た日は晴れ。持たなかった日だけ、空が本気を出す。","買い物メモを作ったのに、そのメモを見るのを忘れる。","冷凍ごはんを温めた後に、おかずを考え始める。","家を出てから「ゴミ出し今日だっけ？」となる。正解を知るのは帰宅後。","インターホンが鳴った瞬間、頼んだ荷物でも少し居留守を考える。","「これだけ買う」と決めてドラッグストアへ行き、予定外の物だけ買って帰る。","レシートを捨てた瞬間、「返品するかも」が頭をよぎる。","シャンプーを流している最中に、今日一番いいアイデアを思いつく。出たら忘れる。","服を買った日の帰りだけ、急にその服を着ている人をたくさん見かける。","「この道、近道だよ」と言った人の後ろを、だいたい遠回りしながらついていく。","人の名前が出てこない時ほど、その人の前で誰かに紹介しなければならない。","スーパーで半額シールを見つけると、必要かどうかより先にカゴへ入れている。","寝る前に見た時計が23:58。次に見た時計が2:17。誰が時間を進めた？","美容院の「前髪、このくらいで大丈夫ですか？」だけ、急に人生を左右する質問になる。","「一回だけ確認する」と言ってSNSを開き、30分後に手が冷たくなっている。","コンビニで店員さんに「温めますか？」と聞かれ、何も考えず「お願いします」と言う。アイスです。","急いでいる日に限って、靴下の片方だけが異世界にいる。","横断歩道のボタンを押した直後、向こう岸の信号が青になる。","新しいペンを使い始めた日に限って、書くものが特にない。","料理を始めてから、必要な調味料が切れていることを知る。","「今日こそ早く出る」が成功した朝、なぜか電車が遅れている。","ATMでお金を下ろした瞬間、財布に千円札が入っているのを見つける。","マスクを外した後に限って、リップが完璧だったことを思い出す。","家でひとりの時ほど、誰かが来たら困る姿勢でくつろいでいる。","冷蔵庫の中を見て「何もない」と言いながら、食べられる物はちゃんとある。","Googleマップの青い点が自分より迷っている気がする。","エスカレーターで片側に寄った途端、誰も追い越してこない。","電車を降りた後に、座っていた場所へスマホを忘れた気がしてポケットを全確認する。","予定より早く着いた日に限って、時間をつぶせる店が見つからない。","洗顔料と歯みがき粉の見た目が似ている朝は、人生に少し緊張感がある。","一度も使っていないエコバッグはあるのに、買い物の日だけ忘れる。","写真を撮る時だけ、急にどこへ手を置けばいいかわからなくなる。","「この袋、まだ使える」と取っておいた袋が、引き出しを支配し始める。","布団に入った後、喉が渇く。これは布団の仕組みだと思う。","会計の時だけ、ポイントカードの居場所がわからなくなる。","スマホの画面を拭いた直後、指紋を確認するために触ってしまう。"]; const list=document.querySelector('#list'),count=document.querySelector('#count'),toast=document.querySelector('#toast');
ideas.forEach((text,i)=>{const label=document.createElement('label');label.className='idea';label.innerHTML='<input type="checkbox" value="'+i+'"><span><span class="num">'+(i+1)+'.</span>'+text+'</span>';list.append(label)});
function selected(){return [...document.querySelectorAll('input:checked')].map(x=>+x.value)}
function update(){count.textContent=selected().length+'件を選択中'} list.addEventListener('change',update);
document.querySelector('#clear').onclick=()=>{document.querySelectorAll('input:checked').forEach(x=>x.checked=false);update()};
document.querySelector('#copy').onclick=async()=>{const ids=selected();if(!ids.length){toast.textContent='先にネタを選んでね';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600);return}const text=ids.map(i=>(i+1)+'. '+ideas[i]).join('\n');try{await navigator.clipboard.writeText(text);toast.textContent='コピーしました！'}catch{toast.textContent='コピーできなかったので長押しで選んでね'}toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)};
</script></body></html>
