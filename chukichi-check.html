<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中吉・追加文章チェック</title><style>
:root{--blue:#36aeea;--ink:#173548}*{box-sizing:border-box}body{margin:0;background:#f3fbff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}main{max-width:850px;margin:auto;padding:34px 18px 70px}h1{font-size:28px;margin:0 0 8px;color:#1688c4}p{line-height:1.7}.note,.copybox{background:#fff;border:2px solid #bdeaff;border-radius:16px;padding:15px 18px;margin:18px 0 24px}.copybox{position:sticky;top:10px;z-index:2;box-shadow:0 4px 16px #1688c420}.copybox strong{display:block;margin-bottom:8px}.copybox textarea{width:100%;min-height:106px;border:1px solid #a8dff5;border-radius:10px;padding:10px;font:15px/1.5 inherit;resize:vertical}.actions{display:flex;gap:9px;margin-top:10px;align-items:center}.actions button{border:0;border-radius:10px;background:var(--blue);color:white;padding:9px 14px;font-weight:800;font-size:15px}.actions span{font-size:14px}.list{display:grid;gap:12px}.item{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid #d7edf7;border-radius:14px;padding:16px;box-shadow:0 2px 8px #1688c410}.item:has(input:checked){border-color:var(--blue);background:#eefaff}.item input{accent-color:var(--blue);width:23px;height:23px;margin-top:2px;flex:none}.num{font-weight:800;color:#1688c4;font-size:14px;display:block;margin-bottom:5px}.text{font-size:17px;line-height:1.65}.bar{position:sticky;bottom:12px;background:#173548;color:white;border-radius:20px;padding:13px 17px;margin-top:23px;box-shadow:0 5px 18px #17354844}.bar button{float:right;border:0;border-radius:12px;background:#fff;color:#173548;padding:7px 11px;font-weight:700}@media(max-width:500px){main{padding:24px 13px 60px}h1{font-size:24px}.text{font-size:16px}}</style></head><body><main><h1>中吉・追加文章 60個</h1><p>中吉は「完璧じゃないけど、ちゃんといい感じ」の温度感。採用したいものにチェックを入れてね。</p><div class="note">前半20個はゆるく本音系、21〜40は「速報・予報」系、41〜60は日常のあるある・気分上がる系です。</div><section class="copybox"><strong>選んだ文章をコピー</strong><textarea id="copied" readonly placeholder="チェックを入れると、ここに選んだ文章が並びます"></textarea><div class="actions"><button id="copy">文章をコピー</button><span id="copyStatus"></span></div></section><section class="list" id="list"></section><div class="bar"><span id="count">0個チェック済み</span><button id="clear">チェックを外す</button></div></main><script>
const texts=["前髪は決まった。毛先はこれから話し合いましょう。","今日の髪、全部は言うことを聞かない。でも大事なところは大丈夫そう。","鏡の前では85点。外に出たらたぶん90点。","片方の耳にかけたら、急に話がまとまりそう。","今日は髪も私も、ほどほどにごきげん。","ちょっとだけハネてる。でもそこまで気になるほどじゃない。","前髪がいいので、毛先の自由は見なかったことにしよう。","今日の髪、近くで見ると努力が見える。遠くから見るとかなりいい。","予定外の風が吹いても、直せば戻れるくらいの余裕あり。","髪が決まりきらない日は、耳かけという最終手段があります。","本日の髪、協力的ではある。全面協力ではない。","今日の分け目、いつもと違うけどそれも新鮮。","髪の調子は中吉。でも気分は大吉寄り。","鏡を見たら「まあ、いいんじゃない？」が出る日。","毛先は少し迷ってる。私はもう出かける。","髪がうまくいかない部分もあるけど、全体会議では可決されました。","今日は前髪が主役。毛先は助演です。","直すほど迷いそう。今日はこのあたりで完成にしよう。","髪がほどほどに決まると、気分もほどほどに上向き。","ちょっと惜しい。でもその惜しさ、案外かわいい。","本日のヘア予報：午前は安定。午後は風と相談してください。","髪型速報：前髪は平和です。毛先には少し自由時間を与えています。","お知らせ：本日は「完璧」を目指さず、「いい感じ」で通常運転です。","髪の定期便り：右側は順調です。左側もそのうち追いつくでしょう。","本日の議事録：前髪は可決。毛先は保留。でも全体としては問題なし。","天気予報では風。こちらでは耳かけ。準備はできています。","髪のコンディション、中吉。ひとつ結びにすると急に大吉寄り。","今日はサイドの毛が元気。顔まわりだけ少し主張があります。","前髪は働いている。毛先も、たぶん見えないところで頑張っている。","鏡の中の自分と目が合って、ふたりとも「悪くないね」となりそう。","髪の反抗期、今日は午後から参加予定。午前中のうちに楽しもう。","本日は毛先に少しクセあり。けれど愛嬌として受理されました。","髪が思いどおりにならないので、今日は服に助けてもらいましょう。","いつもより少しだけ違う。その少しが、今日はちょうど面白い。","前髪に救われ、耳かけに救われ、なんとかいい感じに着地する日。","横から見たら思ったよりいい。正面はもう少しだけ研究中。","本日の髪、100点ではない。でも「まあ会いたい人には会える」くらいにはいい。","髪が迷っている間に、私はもう予定へ向かいます。ついてきて。","今日は鏡の前で悩んだ分だけ、外では気にしないでいられそう。","最終チェック完了。気になるところはあるけど、可愛さの範囲内です。","今日は髪の調子がいいので、鏡を見る回数が少し増えそう。","髪がうまくまとまった部分だけ、今日は褒めて育てよう。","前髪の調子がいい。だから今日は、だいたい大丈夫です。","思ったより早くセットが終わった。そのぶんコーヒーをゆっくり飲めそう。","髪が少しだけいい日は、予定より早めに家を出たくなる。","今日は風に勝つより、風が来る前に目的地へ着く作戦。","後ろ姿は見えないけど、たぶんちゃんといい感じ。信じよう。","髪のことを忘れて笑えたら、今日はそれがいちばんの正解。","毛先が少し遊んでいる。休日みたいで悪くない。","今日は「まあいいか」が、ちゃんと可愛く聞こえる日。","前髪が崩れる前に用事を済ませよう。行動力が吉です。","なんとなく髪がまとまったので、なんとなくいいこともありそう。","今日の髪、友達に会うには十分。写真は角度を選べば完璧。","耳にかけた瞬間だけ急に大人っぽい。今日はその瞬間を大事に。","髪型は途中経過。でも気分はもう出発しています。","本日のヘアバランス：かわいさ8、迷い2。だいたい成功です。","鏡との話し合いは終了。お互い納得して出かけましょう。","今日は髪も機嫌が読めない。でも嫌いじゃない顔をしている。","少しだけ整えたら、少し以上に気分が上がるでしょう。","今日の髪、完璧ではない。でも「会う人には会っていい」仕上がりです。"],key='chukichi-checks-v1';let saved=new Set(JSON.parse(localStorage.getItem(key)||'[]'));const list=document.querySelector('#list'),count=document.querySelector('#count'),copied=document.querySelector('#copied'),status=document.querySelector('#copyStatus');function update(){const a=[...document.querySelectorAll('input:checked')].map(x=>+x.value);saved=new Set(a);localStorage.setItem(key,JSON.stringify(a));count.textContent=a.length+'個チェック済み';copied.value=a.map(n=>n+'. '+texts[n-11]).join('\n')}texts.forEach((t,i)=>{const n=i+11,l=document.createElement('label');l.className='item';l.innerHTML='<input type="checkbox" value="'+n+'" '+(saved.has(n)?'checked':'')+'><span><span class="num">'+n+'.</span><span class="text"></span></span>';l.querySelector('.text').textContent=t;l.querySelector('input').onchange=update;list.append(l)});document.querySelector('#clear').onclick=()=>{document.querySelectorAll('input').forEach(x=>x.checked=false);update()};document.querySelector('#copy').onclick=async()=>{if(!copied.value){status.textContent='先に文章をチェックしてね';return}try{await navigator.clipboard.writeText(copied.value);status.textContent='コピーしました！'}catch{copied.focus();copied.select();status.textContent='文章を選択したよ。⌘Cでコピーしてね'}setTimeout(()=>status.textContent='',2400)};update();
</script></body></html>
