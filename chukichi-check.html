<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中吉・追加文章チェック</title><style>
:root{--blue:#36aeea;--ink:#173548}*{box-sizing:border-box}body{margin:0;background:#f3fbff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}main{max-width:850px;margin:auto;padding:34px 18px 70px}h1{font-size:28px;margin:0 0 8px;color:#1688c4}p{line-height:1.7}.note{background:#fff;border:2px solid #bdeaff;border-radius:16px;padding:15px 18px;margin:18px 0 24px}.list{display:grid;gap:12px}.item{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid #d7edf7;border-radius:14px;padding:16px;box-shadow:0 2px 8px #1688c410}.item:has(input:checked){border-color:var(--blue);background:#eefaff}.item input{accent-color:var(--blue);width:23px;height:23px;margin-top:2px;flex:none}.num{font-weight:800;color:#1688c4;font-size:14px;display:block;margin-bottom:5px}.text{font-size:17px;line-height:1.65}.bar{position:sticky;bottom:12px;background:#173548;color:white;border-radius:20px;padding:13px 17px;margin-top:23px;box-shadow:0 5px 18px #17354844}.bar button{float:right;border:0;border-radius:12px;background:#fff;color:#173548;padding:7px 11px;font-weight:700}@media(max-width:500px){main{padding:24px 13px 60px}h1{font-size:24px}.text{font-size:16px}}</style></head>
<body><main><h1>中吉・追加文章 20個</h1><p>中吉は「完璧じゃないけど、ちゃんといい感じ」の温度感です。採用したいものにチェックを入れてね。チェックはこの端末に保存されます。</p><div class="note">大吉ほど調子に乗りすぎず、小吉ほど困っていない。少し笑えて、気分が軽くなる文章を集めました。</div><section class="list" id="list"></section><div class="bar"><span id="count">0個チェック済み</span><button id="clear">チェックを外す</button></div></main><script>
const texts=["前髪は決まった。毛先はこれから話し合いましょう。","今日の髪、全部は言うことを聞かない。でも大事なところは大丈夫そう。","鏡の前では85点。外に出たらたぶん90点。","片方の耳にかけたら、急に話がまとまりそう。","今日は髪も私も、ほどほどにごきげん。","ちょっとだけハネてる。でもそこまで気になるほどじゃない。","前髪がいいので、毛先の自由は見なかったことにしよう。","今日の髪、近くで見ると努力が見える。遠くから見るとかなりいい。","予定外の風が吹いても、直せば戻れるくらいの余裕あり。","髪が決まりきらない日は、耳かけという最終手段があります。","本日の髪、協力的ではある。全面協力ではない。","今日の分け目、いつもと違うけどそれも新鮮。","髪の調子は中吉。でも気分は大吉寄り。","鏡を見たら「まあ、いいんじゃない？」が出る日。","毛先は少し迷ってる。私はもう出かける。","髪がうまくいかない部分もあるけど、全体会議では可決されました。","今日は前髪が主役。毛先は助演です。","直すほど迷いそう。今日はこのあたりで完成にしよう。","髪がほどほどに決まると、気分もほどほどに上向き。","ちょっと惜しい。でもその惜しさ、案外かわいい。"];const key='chukichi-checks-v1';const saved=new Set(JSON.parse(localStorage.getItem(key)||'[]'));const list=document.querySelector('#list'),count=document.querySelector('#count');function update(){const a=[...document.querySelectorAll('input:checked')].map(x=>+x.value);localStorage.setItem(key,JSON.stringify(a));count.textContent=a.length+'個チェック済み'}texts.forEach((t,i)=>{const n=i+11,l=document.createElement('label');l.className='item';l.innerHTML='<input type="checkbox" value="'+n+'" '+(saved.has(n)?'checked':'')+'><span><span class="num">'+n+'.</span><span class="text"></span></span>';l.querySelector('.text').textContent=t;l.querySelector('input').onchange=update;list.append(l)});document.querySelector('#clear').onclick=()=>{document.querySelectorAll('input').forEach(x=>x.checked=false);update()};update();
</script></body></html>
