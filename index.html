<body>
  <main>
    <header><p class="eyebrow">毎日つくる縦型ショート動画</p><h1>今日の髪だくじメーカー</h1><p class="intro">キャラ4人・結果・ラッキー素材を選び、固定あみだルートに沿った8場面の動画案を作ります。</p></header>
    <section class="controls" aria-label="動画をつくる"><button id="generate" class="primary">今日の動画をつくる</button><button id="download" class="secondary" disabled>MP4を書き出す</button><a id="save-video" class="save-video" hidden download>動画を保存する</a><p id="status" role="status">「今日の動画をつくる」を押すと、4人と結果を選びます。</p></section>
    <section class="pool" aria-label="登場キャラクター"><h2>登場キャラクターは全11人</h2><p>1本の動画にはこの中から4人が登場します。残りの7人も次の日以降の候補です。全員が髪吉・大吉・中吉・小吉・吉・凶のどれにでもなれます。</p><div id="character-pool" class="character-pool"></div></section>
    <section id="summary" class="summary" hidden></section><section><h2>動画の8場面</h2><div id="pages" class="pages" aria-live="polite"></div></section><details><summary>固定あみだルート</summary><p>ピンク→青、黄→緑、青→ピンク、緑→黄。キャラが変わっても、このルートと移動の速さは変わりません。</p></details>
  </main>
