<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大吉 文章チェック</title><style>:root{--ink:#4b210d;--paper:#fffdf7;--gold:#e5ad1b;--line:#eadbc8}*{box-sizing:border-box}body{margin:0;background:#fff9e9;color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.65}main{max-width:760px;margin:auto;padding:28px 18px 48px}h1{font-size:28px;line-height:1.35;margin:0 0 6px}p{margin:0 0 20px}.count{font-weight:800;color:#a57000}.item{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:15px;margin:10px 0;font-size:17px;font-weight:600}.item input{width:25px;height:25px;min-width:25px;margin:2px 0 0;accent-color:var(--gold)}.item:has(input:checked){background:#fff2c8;border-color:var(--gold)}button{width:100%;border:0;border-radius:16px;padding:15px;background:var(--gold);color:#422400;font-weight:900;font-size:17px;margin-top:18px}.note{font-size:14px;color:#725a4a;margin-top:12px}</style><main><h1>大吉・追加文章 70個</h1><p>残したい文章をタップしてチェックしてね。チェックはこの端末に残ります。<br><span class="count" id="count">0個選択中</span></p><div id="list"></div><button id="copy" type="button">チェックした文章をコピー</button><p class="note" id="notice" aria-live="polite"></p></main><script>const texts=["今日の髪なら、駅に着いた瞬間にちょうど電車が来るでしょう。","今日の髪なら、買おうと思っていたものがちょうど値引きされているでしょう。","今日の髪なら、いちばん混んでいないレジを一発で見抜けるでしょう。","髪が決まった朝は、忘れ物に玄関で気づけるでしょう。","今日のツヤなら、急な写真にも真正面から参加できるでしょう。","髪がいいから、午後の前髪までちゃんと味方でいてくれるでしょう。","今日の髪なら、カフェで座りたかった席が空いているでしょう。","髪が決まったので、苦手な電話もなぜか一回で終わるでしょう。","今日の髪なら、靴ひもがほどけずに一日を終えられるでしょう。","髪がいい日は、冷蔵庫にちょうど好きなものが残っているでしょう。","今日の髪なら、歩いているだけで小さなラッキーを拾えるでしょう。","髪が決まったから、予定外の寄り道まで大当たりになるでしょう。","今日の髪なら、雨が降っても傘を持っている日でしょう。","髪がいいから、スマホの充電があと1%でもちゃんと帰れるでしょう。","今日の髪なら、会いたかった人にばったり会えるでしょう。","髪が決まった日は、帰宅後まで『今日いい感じだったな』が続くでしょう。","今日の髪なら、宅配便がちょうど家にいる時間に来るでしょう。","髪がいいから、苦手な人との会話も思ったより早く終わるでしょう。","今日の髪なら、最後の一席がちゃんと自分のために空いているでしょう。","髪が決まったので、今日だけは運にも少し贔屓されるでしょう。","今日の髪なら、エレベーターの扉が閉まる寸前にふわっと開くでしょう。","髪が決まったので、店員さんに「ちょうど最後の一つです」と言われるでしょう。","今日の髪なら、欲しかった色だけ在庫が残っているでしょう。","髪がいいから、時間を見たらちょうどいい電車が来るでしょう。","今日の髪なら、欲しかった予定がひとつだけうまく決まるでしょう。","髪が決まったので、今日は運がこちらの席に座っているでしょう。","今日の髪なら、カフェで注文したものが写真よりいい感じに届くでしょう。","髪がいいから、待ち合わせ前に鏡を見に行きたくなるでしょう。","今日の髪なら、目的がなくてもデパートの一階を通りたくなるでしょう。","髪が決まったので、写真を撮られても「今じゃない」と言わないでしょう。","髪がいいから、信号待ちのガラスに映る自分を一度は見るでしょう。","今日の髪なら、コンビニの新作スイーツまでご褒美にしていいでしょう。","髪が決まったので、帰り道の寄り道も完全に正解でしょう。","今日の髪なら、電話の声まで少し明るくなるでしょう。","髪がいいから、用事がなくてもメイク直しの場所を探すでしょう。","今日の髪なら、鏡に映った自分へ小さくうなずくでしょう。","髪が決まったので、いつもの服も急に主役級に見えるでしょう。","今日の髪なら、知らない人の笑顔まで自分へのサービスに見えるでしょう。","髪がいいから、帰りに花か新しいおやつを買う理由ができるでしょう。","今日の髪なら、一日の終わりまで『朝の私、天才』と思えるでしょう。","店内に入った時のBGMが、自分の登場曲に聞こえるでしょう。なぜなら、今日の主役が入店したから。","今日の髪なら、カフェの扉を開けた瞬間に空いている席が見つかるでしょう。なぜなら、毛先まで準備万端だから。","信号がちょうど青になるでしょう。なぜなら、前髪が赤信号を出していないから。","帰り道の夕焼けまできれいに見えるでしょう。なぜなら、今日の自分に背景が必要だから。","今日の髪なら、欲しかった物が最後の一個だけ残っているでしょう。なぜなら、運も主役を待っていたから。","エレベーターがすぐ来るでしょう。なぜなら、今日は待たせる側の髪だから。","今日の髪なら、店員さんの笑顔が少し輝いて見えるでしょう。なぜなら、いい感じの人が来店したから。","電車の最後の一席が空いているでしょう。なぜなら、今日の髪に立ちっぱなしは似合わないから。","今日の髪なら、風が一回だけ完璧なタイミングで吹くでしょう。なぜなら、今日は演出スタッフもいるから。","注文したランチがいちばん早く届くでしょう。なぜなら、髪が空腹を待たせないから。","今日の髪なら、知らない人の犬までしっぽを振ってくれるでしょう。なぜなら、雰囲気がいいから。","鏡に映る自分がいつもより華やかでしょう。なぜなら、朝のセットが大仕事をしたから。","今日の髪なら、予定がなくても外へ出る理由が見つかるでしょう。なぜなら、この仕上がりを家に置いておけないから。","コンビニの自動ドアを通るだけで少し気分が上がるでしょう。なぜなら、今日の主役が入店したから。","今日の髪なら、待ち合わせの相手が先に見つけてくれるでしょう。なぜなら、見つけやすいほどいい感じだから。","写真を撮る時、いつもより自然に笑えるでしょう。なぜなら、髪が先に自信をくれたから。","今日の髪なら、帰り道に寄りたいお店がちょうど開いているでしょう。なぜなら、寄り道まで予定に入っているから。","カフェで頼むものまで少しおいしく感じるでしょう。なぜなら、気分が大吉だから。","今日の髪なら、知らない街でも方向を間違えないでしょう。なぜなら、毛先が進む方向を知っているから。","家を出てから一度も前髪を直さずに済むでしょう。なぜなら、今日は前髪がプロだから。","今日の髪なら、誰かに会っても『見られて困る日』ではないでしょう。なぜなら、むしろ見せどころだから。","何気ない買い物まで少し特別に感じるでしょう。なぜなら、今日の自分がちょっと特別だから。","今日の髪なら、レシートの合計金額まで思ったよりやさしいでしょう。なぜなら、運も空気を読んでいるから。","歩くだけでちょっとごきげんになるでしょう。なぜなら、今日の髪がちゃんとついてきているから。","今日の髪なら、帰りに小さなラッキーを一つ持ち帰るでしょう。なぜなら、朝からいい流れだから。","いつもの服が少し格上げされて見えるでしょう。なぜなら、髪が全体を引っ張っているから。","今日の髪なら、誰かの『なんかいいね』を一回は引き出せるでしょう。なぜなら、今日は隠しきれないから。","用事が終わってもすぐ帰りたくないでしょう。なぜなら、このコンディションをもう少し連れ回したいから。","今日の髪なら、一日の終わりに鏡を見ても少しうれしいでしょう。なぜなら、朝の自分がまだ仕事しているから。","今日は少しだけ堂々として歩けるでしょう。なぜなら、髪が先に背中を押しているから。"];const key='daikichi-checks-v1',saved=new Set(JSON.parse(localStorage.getItem(key)||'[]')),list=document.querySelector('#list'),count=document.querySelector('#count');function refresh(){const chosen=[...saved].sort((a,b)=>a-b);localStorage.setItem(key,JSON.stringify(chosen));count.textContent=chosen.length+'個選択中'}texts.forEach((text,index)=>{const label=document.createElement('label');label.className='item';const input=document.createElement('input');input.type='checkbox';input.checked=saved.has(index);input.addEventListener('change',()=>{input.checked?saved.add(index):saved.delete(index);refresh()});const span=document.createElement('span');span.textContent=(index+11)+'. '+text;label.append(input,span);list.append(label)});refresh();document.querySelector('#copy').addEventListener('click',async()=>{const picked=[...saved].sort((a,b)=>a-b).map(i=>(i+11)+'. '+texts[i]).join('\n');if(!picked){document.querySelector('#notice').textContent='まず残したい文章にチェックを入れてね。';return}try{await navigator.clipboard.writeText(picked);document.querySelector('#notice').textContent='チェックした文章をコピーしました。ここに貼り付けて送ってね。'}catch{document.querySelector('#notice').textContent='コピーできなかったため、チェック済みの番号を教えてね。'}})</script>
